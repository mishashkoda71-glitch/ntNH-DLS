name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    # ЖЕСТКИЙ ФИКС: Копируем наши файлы в правильную структуру
    - name: Prepare Project
      run: |
        mkdir -p app/src/main/java/org/ntnh_dls
        cp app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml || true
        cp app/src/main/java/org/ntnh_dls/MainActivity.java app/src/main/java/org/ntnh_dls/ || true

    - name: Download Gradle 8.7
      run: |
        wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle-8.7-bin.zip

    - name: Build with Gradle
      run: |
        # Принудительно указываем путь к нашему проекту
        ./gradle-8.7/bin/gradle -p . assembleDebug --stacktrace
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: overlay-apk
        path: app/build/outputs/apk/debug/*.apk
